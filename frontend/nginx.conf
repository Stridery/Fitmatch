# 让 WebSocket 正确升级
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # 前端静态资源
  root /usr/share/nginx/html;
  index index.html;

  # SPA 路由
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ---- 反代 API：/api/** -> api-gateway:8080/** ----
  # 注意 proxy_pass 以 / 结尾，这样会把 /api 前缀剥掉
  # 例如 /api/users -> 网关收到 /users（正好匹配你的 Spring 路由 Path=/users/**）
  location /api/ {
    proxy_pass http://api-gateway:8080/;
    proxy_http_version 1.1;

    # 透传一些头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # ---- 反代 Socket.IO：/socket.io/** -> chat-service:4000/socket.io/** ----
  location /socket.io/ {
    proxy_pass http://chat-service:4000/socket.io/;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }
}