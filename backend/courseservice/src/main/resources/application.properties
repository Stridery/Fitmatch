# ✅ Hibernate JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ✅ HikariCP 连接池配置 - 解决prepared statement冲突
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.prepare-threshold=0
spring.datasource.hikari.cache-prep-stmts=false

# PostgreSQL prepared statement 配置 - 禁用缓存
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0

# 日志级别（可调）
logging.level.org.springframework=INFO

# 健康检查端点（可选）
management.endpoints.web.exposure.include=health,info