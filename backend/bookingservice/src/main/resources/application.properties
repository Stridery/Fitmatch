spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://sppzmqwocajtdvazhehp.supabase.co/auth/v1/keys
spring.jpa.open-in-view=false

# ✅ Hibernate JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ✅ 数据库连接池配置（解决prepared statement问题）
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=30000

# PostgreSQL prepared statement 配置 - 完全禁用缓存
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.cachePrepStmts=false

# ✅ MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.fitmatch.bookingservice.dto
mybatis.type-handlers-package=com.fitmatch.bookingservice.config
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.configuration.jdbc-type-for-null=NULL

# 日志级别
logging.level.com.fitmatch.bookingservice.mapper=DEBUG
logging.level.org.apache.ibatis=DEBUG

# 日志级别（可调）
logging.level.org.springframework=INFO
logging.level.com.fitmatch.bookingservice=DEBUG

# 健康检查端点（可选）
management.endpoints.web.exposure.include=health,info

# SQL函数初始化配置 - 禁用自动执行，使用SqlFunctionInitializer
spring.sql.init.mode=never

# ✅ Jackson JSON 配置 - 确保Instant正确序列化为ISO 8601
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC