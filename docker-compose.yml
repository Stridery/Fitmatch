services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
      - chat-service
      - user-service
      - course-service
      - booking-service

  api-gateway:
    build:
      context: ./backend/apigateway
    expose:
      - "8080"
    environment:
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - user-service
      - course-service
      - booking-service

  chat-service:
    build:
      context: ./backend/chatservice
    expose:
      - "4000"
    env_file:
      - ./backend/chatservice/.env

  user-service:
    build:
      context: ./backend/userservice
    expose:
      - "8081"

  course-service:
    build:
      context: ./backend/courseservice
    expose:
      - "8082"

  booking-service:
    build:
      context: ./backend/bookingservice
    expose:
      - "8083"